<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plivo IVR Demo</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f5f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        h1 {
            color: #333;
            margin-top: 0;
            text-align: center;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #666;
        }
        input[type="text"] {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
            box-sizing: border-box; /* Ensures padding doesn't affect width */
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        #status {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 4px;
            display: none;
            text-align: center;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            display: block !important;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            display: block !important;
        }
        .loading {
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>📞 Make a Call</h1>
        <form id="callForm">
            <div class="form-group">
                <label for="phoneNumber">Phone Number</label>
                <input type="text" id="phoneNumber" name="to" placeholder="+14155552671" required>
            </div>
            <button type="submit" id="callButton">Initiate Call</button>
        </form>
        <div id="status"></div>
    </div>

    <script>
        const form = document.getElementById('callForm');
        const statusDiv = document.getElementById('status');
        const button = document.getElementById('callButton');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Reset status
            statusDiv.className = '';
            statusDiv.style.display = 'none';
            statusDiv.textContent = '';
            
            // Loading state
            button.disabled = true;
            button.classList.add('loading');
            button.textContent = 'Calling...';

            const formData = new FormData(form);
            const to = formData.get('to');

            try {
                const response = await fetch('/call', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ to })
                });

                const data = await response.json();

                if (response.ok) {
                    statusDiv.textContent = `Success! Call UUID: ${data.message || 'Initiated'}`;
                    statusDiv.classList.add('success');
                } else {
                    throw new Error(data.error || 'Failed to initiate call');
                }
            } catch (error) {
                statusDiv.textContent = `Error: ${error.message}`;
                statusDiv.classList.add('error');
            } finally {
                button.disabled = false;
                button.classList.remove('loading');
                button.textContent = 'Initiate Call';
            }
        });
    </script>
</body>
</html>
